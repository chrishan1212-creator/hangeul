# 폰에서도 일레븐랩스 목소리로 음성 파일을 만들 수 있게 하는 워크플로.
# GitHub → Actions → "🗣️ 일레븐랩스 목소리 만들기" → Run workflow 를 누르면
# mp3 를 만들어 이 브랜치에 바로 커밋해 준다. (Vercel 은 자동으로 다시 배포된다)
#
# 미리 해둘 것: Settings → Secrets and variables → Actions 에
#   ELEVENLABS_API_KEY   일레븐랩스 API 키
#   ELEVENLABS_VOICE_ID  쓸 목소리 ID (아래 입력칸에 직접 넣어도 된다)
name: 🗣️ 일레븐랩스 목소리 만들기

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "범위 (sample=맛보기 10개 / combine=소리 만들기 / all=앱 전체)"
        type: choice
        default: sample
        options:
          - sample
          - combine
          - all
      voice_id:
        description: "목소리 ID (비우면 ELEVENLABS_VOICE_ID 시크릿 사용)"
        default: ""
      model:
        description: "모델 (flash 는 크레딧 절반, 품질은 조금 낮음)"
        type: choice
        default: eleven_multilingual_v2
        options:
          - eleven_multilingual_v2
          - eleven_flash_v2_5
      speed:
        description: "말하는 속도 (0.7~1.2, 1이 보통)"
        default: "0.9"
      force:
        description: "이 목소리로 이미 만든 파일도 다시 만들기 (크레딧이 다시 나가요)"
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 음성 만들기
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ inputs.voice_id || secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ inputs.model }}
          ELEVENLABS_SPEED: ${{ inputs.speed }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::ELEVENLABS_API_KEY 시크릿이 없습니다. Settings → Secrets and variables → Actions 에서 추가해 주세요."
            exit 1
          fi
          if [ -z "$ELEVENLABS_VOICE_ID" ]; then
            echo "::error::목소리 ID가 없습니다. 입력칸에 넣거나 ELEVENLABS_VOICE_ID 시크릿을 추가해 주세요."
            exit 1
          fi
          npm run audio:eleven -- --scope=${{ inputs.scope }} ${{ inputs.force && '--force' || '' }}

      # 중간에 실패해도 그때까지 만든 파일은 커밋해서 크레딧을 버리지 않는다
      - name: 커밋하기
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio
          if git diff --cached --quiet; then
            echo "바뀐 파일이 없습니다."
            exit 0
          fi
          git commit -m "일레븐랩스 음성 생성 (${{ inputs.scope }})"
          git push
